<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7f3">
  <title>روزنو | برنامه‌ریز روزانه</title>
  <link rel="stylesheet" href="./src/styles/style.css">
  <link rel="stylesheet" href="./src/styles/modal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

  <div class="backdrop hidden" dir="rtl">
    <div class="modal">
      <div class="modal__header">
        <p>ویرایش کار</p>
        <button class="close-modal" aria-label="بستن پنجره"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal__content">
        <label for="edit-todo">عنوان کار</label>
        <input type="text" name="edit-todo" id="edit-todo">
      </div>
      <div class="modal__actions">
        <button class="btn btn--primary close-modal" id="update-todo">ذخیره تغییرات</button>
        <button class="btn btn--outline close-modal">انصراف</button>
      </div>
    </div>
  </div>

  <header class="app-header">
    <a class="brand" href="#" aria-label="روزنو، صفحه اصلی">
      <span class="brand-mark"><i class="fas fa-check"></i></span>
      <span>روزنو</span>
    </a>
    <label class="date-picker" for="planner-date">
      <i class="far fa-calendar-alt" aria-hidden="true"></i>
      <span id="selected-date-label"></span>
      <input id="planner-date" type="date" lang="fa-IR" dir="rtl" aria-label="انتخاب تاریخ برنامه‌ریز">
    </label>
  </header>

  <section class="container">
    <div class="page-heading">
      <span class="eyebrow"><span class="eyebrow-dot"></span> قدم‌به‌قدم، رو به جلو</span>
      <h1 id="day-heading">کارهای امروز</h1>
      <p>ذهنت را خلوت کن؛ کارهایت را اینجا ثبت کن.</p>
    </div>
    <div class="form-container">
      <form class="todo-form">
        <input type="text" class="todo-input" placeholder="یک کار تازه بنویس..." aria-label="عنوان کار تازه" />
        <button class="add-todo" type="submit" aria-label="افزودن کار" title="افزودن کار">
          <i class="fas fa-plus-circle"></i>
        </button>
      </form>
      <div class="select">
        <i class="fas fa-sliders-h filter-icon" aria-hidden="true"></i>
        <select class="filter-todos" name="todos" aria-label="فیلتر کارها">
          <option value="all">همه کارها</option>
          <option value="completed">انجام‌شده</option>
          <option value="uncompleted">در انتظار</option>
        </select>
      </div>
    </div>
    <div class="todo-container">
      <div class="list-heading">
        <h2>فهرست کارها</h2>
        <span>کارهای کوچک، نتیجه‌های بزرگ</span>
      </div>
      <p class="todo-empty"><i class="far fa-clipboard"></i><span>هنوز کاری ثبت نشده؛ از اولین قدم شروع کن.</span></p>
      <ul class="todolist">
        <!-- <li class="todo">
          <p class="todo__title">todo #1</p>
          <span class="todo__createdAt">1402/1/28</span>
          <button><i class="todo__check far fa-check-square"></i></button>
          <button><i class="todo__remove far fa-trash-alt"></i></button>
        </li> -->
      </ul>
    </div>
  </section>
  <script src="./src/js/todolist.js"></script>
  <script src="./src/js/modal.js"></script>
</body>

</html>
